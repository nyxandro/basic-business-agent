# Development stand on the developer's machine: the database and a LiteLLM with mock models for tests.
# Start: pnpm dev:db. Values come from .env in the repository root (see .env.example).
# `pnpm dev` adds compose.app.yaml: the LiteLLM of the installation with real models.
name: bba-dev

services:
  db:
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:?set POSTGRES_PORT in .env}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  # LiteLLM for automated tests: mock models only (deploy/litellm/test.config.json), its own schema.
  litellm-test:
    image: ghcr.io/berriai/litellm:v1.109.1@sha256:11175975a3093e05e92faee2fe2fe3412a3ae2fcaa849eb0fe25d5f0d8bcb2e9
    command: ["--config", "/app/config.json", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_TEST_MASTER_KEY:?set LITELLM_TEST_MASTER_KEY in .env}
      LITELLM_CALLBACK_AUTHORIZATION: Bearer ${LITELLM_TEST_CALLBACK_SECRET:?set LITELLM_TEST_CALLBACK_SECRET in .env}
      # Encrypts the provider keys of models the tests store in LiteLLM's database.
      LITELLM_SALT_KEY: ${LITELLM_TEST_SALT_KEY:?set LITELLM_TEST_SALT_KEY in .env}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=litellm_test
      # Write spend to the database every second, so tests can compare it with our ledger quickly.
      PROXY_BATCH_WRITE_AT: "1"
      # ChatGPT subscription models of the tests answer from a fake ChatGPT on this machine
      # (core/models/fake-chatgpt.ts, TEST_CHATGPT_PORT).
      CHATGPT_API_BASE: http://host.docker.internal:39998/codex
    volumes:
      - ./litellm/test.config.json:/app/config.json:ro
      # Login files of the tests' ChatGPT accounts; the tests write them on this machine.
      # pnpm dev:db creates the folder first, otherwise Docker would create it owned by root.
      - ../.data/chatgpt-auth-test:/chatgpt-auth
    ports:
      - "127.0.0.1:${LITELLM_TEST_PORT:?set LITELLM_TEST_PORT in .env}:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')\""]
      interval: 3s
      timeout: 3s
      retries: 60

volumes:
  db-data:
