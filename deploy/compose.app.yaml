# LiteLLM of the installation for development, on top of compose.dev.yaml (pnpm dev / pnpm dev:stack):
# pnpm gateway:config writes deploy/litellm/config.json; models and provider keys come from
# «Нейросеть» into LiteLLM's database. Kept apart so that tests (pnpm dev:db) do not start it.
# Its own database litellm_dev on the development server: checks inside LiteLLM's migrations look
# for constraints across the whole database and trip over the test LiteLLM's schema next door.
# A deployment has one LiteLLM, so there it uses the schema litellm of the main database.
services:
  # Creates the database litellm_dev once; does nothing when it exists.
  litellm-dev-db:
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    command: ["sh", "-c", "psql -tAc \"SELECT 1 FROM pg_database WHERE datname = 'litellm_dev'\" | grep -q 1 || psql -c 'CREATE DATABASE litellm_dev'"]
    depends_on:
      db:
        condition: service_healthy

  litellm:
    image: ghcr.io/berriai/litellm:v1.109.1@sha256:11175975a3093e05e92faee2fe2fe3412a3ae2fcaa849eb0fe25d5f0d8bcb2e9
    command: ["--config", "/app/config.json", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY in .env}
      LITELLM_CALLBACK_AUTHORIZATION: Bearer ${LITELLM_CALLBACK_SECRET:?set LITELLM_CALLBACK_SECRET in .env}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/litellm_dev
      # Encrypts the provider keys LiteLLM keeps in its database; never change it once models are added.
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?set LITELLM_SALT_KEY in .env}
    volumes:
      - ./litellm/config.json:/app/config.json:ro
      # Login files of the ChatGPT accounts: the server on this machine writes them, LiteLLM reads
      # them and writes refreshed tokens back (pnpm dev:stack creates the folder first).
      - ${APP_CHATGPT_AUTH_DIR:?set APP_CHATGPT_AUTH_DIR in .env}:/chatgpt-auth
    ports:
      - "127.0.0.1:${LITELLM_PORT:?set LITELLM_PORT in .env}:4000"
    # In development the server runs on this machine; LiteLLM reports usage to it through the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      litellm-dev-db:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')\""]
      interval: 3s
      timeout: 3s
      retries: 60
